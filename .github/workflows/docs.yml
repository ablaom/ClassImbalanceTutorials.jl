name: Generate and Deploy Documentation
on:
  push:
    branches:
      - master
    tags: [v*]
  pull_request:

jobs:
  build:
    if: |
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto-update-tutorials')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'auto-update-tutorials'))
    permissions:
      contents: write
      actions: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'min'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCUMENTER_DEBUG: "true"
