name: Tutorials - Test and Generate Markdown
env:
  ACTIONS_STEP_DEBUG: true
on:
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # get entire commit history, needed for changed-files to work

      - name: Get relevent changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            root_manifest:
              - Manifest*.toml
            tutorials:
              - docs/src/tutorials/**

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.5'

      - name: Enable Caching
        uses: julia-actions/cache@v3

      - name: Julia Package Environment - Instantiate and Build
        uses: julia-actions/julia-buildpkg@v1
        
      - name: Force Re-resolve
        run: julia --project -e 'using Pkg; Pkg.resolve(); Pkg.instantiate()'        

      - name: Identify, Test, and Generate Tutorial Markdown
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("TutorialTools")
          import TutorialTools
          
          root_manifest_changed =
              "${{ steps.changed-files.outputs.root_manifest_any_changed }}" == "true"
          changed_tutorial_files =
              split("${{ steps.changed-files.outputs.tutorials_all_changed_files }}", " ")

          # Path to directory where tutorial subfolders live
          tutorial_root = joinpath("docs", "src", "tutorials")

          # Construct a list of dirs for tutorials needing regeneration
          tutorial_dirs = root_manifest_changed ? 
              TutorialTools.dirs_containing(root=tutorial_root) : # all subdirs of root
              TutorialTools.dirs_containing(changed_tutorial_files; root=tutorial_root)

          # Test/generate the tutorials:
          success = TutorialTools.generate(tutorial_dirs; tests=true)

          if success
              @info "All tutorials requiring regeneration have been successfully tested "*
                  "and regenerated. "
          else
              @info "Problems encountered testing or regenerating some tutorials that "*
                  "require regeneration. "
              exit(1)
          end 
