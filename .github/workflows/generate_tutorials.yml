name: Tutorials - Test and Generate Markdown
env:
  ACTIONS_STEP_DEBUG: true
on:
  pull_request:

jobs:
  generate_tutorial_markdown:
    # exclude PR's spawned by this job; see "create-pull-request" below:
    if: |
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'auto-update-tutorials')) ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'auto-update-tutorials'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # get entire commit history, needed for changed-files to work

      - name: Get relevent changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            projects:
              - "**/Project.toml"
            tutorials:
              - "docs/src/tutorials/**"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: 'min'

      - name: Enable Caching
        uses: julia-actions/cache@v3

      - name: Julia Package Environment - Instantiate and Build
        uses: julia-actions/julia-buildpkg@v1
        
      - name: Identify, Test, and Generate Tutorial Markdown
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("TutorialTools")
          import TutorialTools
          
          workspace_changed =
              "${{ steps.changed-files.outputs.projects_any_changed }}" == "true"
          changed_tutorial_files =
              split("${{ steps.changed-files.outputs.tutorials_all_changed_files }}", " ")

          # Path to directory where tutorial subfolders live
          tutorial_root = joinpath("docs", "src", "tutorials")

          # Construct a list of dirs for tutorials needing regeneration
          tutorial_dirs = workspace_changed ? 
              TutorialTools.dirs_containing(root=tutorial_root) : # all subdirs of root
              TutorialTools.dirs_containing(changed_tutorial_files; root=tutorial_root)

          # Test and generate the tutorials:
          markdown_files = TutorialTools.generate(tutorial_dirs, "docs"; tests=true)

          if markdown_files == false
              @error "Problem testing a tutorial or generating its markdown"
              exit(1)
          else 
              @info "Successfully re-generated these markdown files:\n "*
                  "$markdown_files "
          end 

      - name: Create Pull Request for Adding new Tutorial Markdown
        id: spawn_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update tutorial markdown"
          branch: auto-update-tutorials
          base: master
          title: "Commit Tutorial Markdown Changes"
          body: |
            This PR was automatically generated by \#${{ github.event.pull_request.number }}
            to update tutorial markdown files based on changes to tutorial script files or 
            some Project.toml file.

            **Close and immediately re-open this PR** to regenerate documentation.
            If successful, merge this PR to trigger deployment of the new docs to gh-pages.

            You can check repository "Actions" to check when deployment this is complete.
          delete-branch: true
          add-paths: |
            **/tutorial.md

      - name: Post Comment
        if: steps.spawn_pr.outputs.pull-request-operation == 'created'
        uses: mshick/add-pr-comment@v3
        with:
          message: |
            A tutorial script file or Project.toml file has changed and new tutorial 
            markdown has been generated. Review \#{{ steps.cpr.outputs.pull-request-number }}to commit the changes
            and update the documentation on gh-pages.

