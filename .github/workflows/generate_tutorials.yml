name: Tutorials - Test and Generate Markdown
env:
  ACTIONS_STEP_DEBUG: true
on:
  pull_request:

jobs:
  generate_tutorial_markdown:
    # exclude PR's with title beginning with "[docs]"
    if: ${{ !startsWith(github.event.pull_request.title, '[docs]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # get entire commit history, needed for changed-files to work

      - name: Get relevent changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            projects:
              - "**/Project.toml"
            tutorials:
              - "docs/src/tutorials/**"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: 'min'

      - name: Enable Caching
        uses: julia-actions/cache@v3

      - name: Julia Package Environment - Instantiate and Build
        uses: julia-actions/julia-buildpkg@v1
        
      - name: Identify, Test, and Generate Tutorial Markdown
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("TutorialTools")
          import TutorialTools
          
          workspace_changed =
              "${{ steps.changed-files.outputs.projects_any_changed }}" == "true"
          changed_tutorial_files =
              split("${{ steps.changed-files.outputs.tutorials_all_changed_files }}", " ")

          # Path to directory where tutorial subfolders live
          tutorial_root = joinpath("docs", "src", "tutorials")

          # Construct a list of dirs for tutorials needing regeneration
          tutorial_dirs = workspace_changed ? 
              TutorialTools.dirs_containing(root=tutorial_root) : # all subdirs of root
              TutorialTools.dirs_containing(changed_tutorial_files; root=tutorial_root)

          # Test and generate the tutorials:
          markdown_files = TutorialTools.generate(tutorial_dirs, "docs"; tests=true)

          if markdown_files == false
              @error "Problem testing a tutorial or generating its markdown"
              exit(1)
          else 
              @info "Successfully re-generated these markdown files:\n "*
                  "$markdown_files "
          end 

      - name: Create Pull Request for Adding new Tutorial Markdown
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "add newly generated tutorial markdown"
          branch: auto-update-tutorials
          base: master
          title: "[docs] Commit Changed Tutorial Markdown and Regenerate/Deploy Docs"
          body: |
            This PR was automatically generated to update tutorial markdown files
            generated by the generate_tutorials.yml workflow. Close and immediately
            re-open this PR to trigger regeneration and deployment of documentation,
            and if successful, merge this PR to update the GH pages docs.
          delete-branch: true
          add-paths: |
            **/tutorial.md
